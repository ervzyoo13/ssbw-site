  <path d="M75 18.5Q80 22.5 85 18.5" fill="none" stroke="#150903" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Wheels. Any group with class="wheel" turns as the cart drives (js/route.js) -->
  <g class="wheel">
    <circle cx="50" cy="152" r="18" fill="#150903"/>
    <circle cx="50" cy="152" r="11" fill="#D7B151"/>
    <path d="M50 141V163M39 152H61M42.2 144.2L57.8 159.8M42.2 159.8L57.8 144.2" stroke="#150903" stroke-width="2.6"/>
