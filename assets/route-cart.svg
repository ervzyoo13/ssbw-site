    <path fill="currentColor" d="M610 0H672L686 98L702 0H762L778 98L792 0H854L816 180H760L732 70L704 180H648Z"/>
    <circle fill="currentColor" cx="889" cy="153" r="27"/>
  </g>
  <rect x="14" y="89" width="132" height="8" rx="4" fill="#8A5230" stroke="#150903" stroke-width="4"/>

