  <path d="M28 46H132L150 70A11.67 11.67 0 0 1 126.67 70A11.67 11.67 0 0 1 103.33 70A11.67 11.67 0 0 1 80 70A11.67 11.67 0 0 1 56.67 70A11.67 11.67 0 0 1 33.33 70A11.67 11.67 0 0 1 10 70Z" fill="none" stroke="#150903" stroke-width="5" stroke-linejoin="round"/>

  <!-- The burger on the roof -->
  <g stroke="#150903" stroke-width="4" stroke-linejoin="round">
