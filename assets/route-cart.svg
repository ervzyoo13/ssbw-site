<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 160 186">
  <title>SimSim food cart, TEMP drawing. See docs/IMAGES.md to swap it for another SVG.</title>

  <!-- White sticker edge, so the cart and its dark wheels stay clear of the near-black road -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="13" stroke-linejoin="round">
    <path d="M52 23C52 9 64 2 80 2C96 2 108 9 108 23V42C108 46 104 48 100 48H60C56 48 52 46 52 42Z"/>
