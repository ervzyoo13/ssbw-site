    <path d="M50 26C52 20 58 22 60 24C63 20 68 20 70 24C73 20 78 20 80 24C83 20 88 20 90 24C93 20 98 20 100 24C102 22 108 20 110 26C110 30 104 30 100 29C96 32 92 32 90 29C86 32 84 32 80 29C76 32 74 32 70 29C66 32 64 32 60 29C56 30 50 30 50 26Z" fill="#7FA63C" stroke-width="3"/>
