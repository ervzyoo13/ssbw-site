    <rect x="20" y="70" width="120" height="76" rx="6"/>
    <circle cx="50" cy="152" r="18"/>
    <circle cx="110" cy="152" r="18"/>
  </g>

  <!-- Window, posts and counter -->
  <rect x="24" y="66" width="112" height="30" fill="#3A1210"/>
  <path d="M26 66V94M134 66V94" fill="none" stroke="#150903" stroke-width="6"/>

  <!-- Maroon body with the SSBW. wordmark (TEMP wordmark, same drawing as the top bar) -->
  <rect x="20" y="94" width="120" height="52" rx="6" fill="#8C2421" stroke="#150903" stroke-width="5"/>
  <path d="M23 136H137V140C137 142 135 144 133 144H27C25 144 23 142 23 140Z" fill="#741C1A"/>
  <g transform="translate(30 105) scale(.1087)" color="#F6E9D6">
    <g fill="none" stroke="currentColor" stroke-width="52" stroke-linejoin="round">
      <path d="M180 26H62A32 32 0 0 0 62 90H128A32 32 0 0 1 128 154H10"/>
      <path d="M382 26H264A32 32 0 0 0 264 90H330A32 32 0 0 1 330 154H212"/>
